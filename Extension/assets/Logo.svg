<svg width="960" height="960" viewBox="0 0 960 960" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <clipPath id="clip_squircle">
    <rect width="960" height="960" rx="216" fill="white"/>
  </clipPath>

  <linearGradient id="oceanBg" x1="0" y1="0" x2="960" y2="960" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#040a14"/>
    <stop offset="50%" stop-color="#071526"/>
    <stop offset="100%" stop-color="#0a1f38"/>
  </linearGradient>

  <linearGradient id="sharkCyan" x1="200" y1="200" x2="800" y2="700" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#00f0ff"/>
    <stop offset="50%" stop-color="#00d2ff"/>
    <stop offset="100%" stop-color="#0284c7"/>
  </linearGradient>

  <linearGradient id="sharkFinShade" x1="350" y1="150" x2="700" y2="600" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#38bdf8"/>
    <stop offset="100%" stop-color="#0369a1"/>
  </linearGradient>

  <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00d2ff" stroke-width="1.2" opacity="0.35"/>
  </pattern>

  <filter id="oceanGlow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="24" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
</defs>

<g clip-path="url(#clip_squircle)">
  <!-- Background Ocean Abyss + Technical Grid -->
  <rect width="960" height="960" fill="url(#oceanBg)"/>
  <rect width="960" height="960" fill="url(#gridPattern)" opacity="0.6"/>

  <!-- ===== Motion Doodles in Background ===== -->
  <g fill="none" stroke="#00d2ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.65">
    <!-- Clapperboard - top-left -->
    <g transform="translate(78,78) rotate(-6)">
      <rect x="0" y="0" width="94" height="20" rx="6"/>
      <polygon points="6,0 20,0 12,20 -2,20" fill="#00d2ff" stroke="none"/>
      <polygon points="30,0 44,0 36,20 22,20" fill="#00d2ff" stroke="none"/>
      <polygon points="54,0 68,0 60,20 46,20" fill="#00d2ff" stroke="none"/>
      <polygon points="78,0 92,0 84,20 70,20" fill="#00d2ff" stroke="none"/>
      <rect x="4" y="20" width="86" height="54" rx="10"/>
    </g>

    <!-- Play button - top-right -->
    <g transform="translate(830,70)">
      <circle cx="0" cy="0" r="28"/>
      <polygon points="-8,-13 19,0 -8,13" fill="#00d2ff" stroke="none"/>
    </g>

    <!-- Timeline with clips - top-right below play -->
    <g transform="translate(600, 150)">
      <rect x="0" y="0" width="150" height="26" rx="6"/>
      <rect x="6" y="5" width="40" height="16" rx="3" fill="#00d2ff" stroke="none"/>
      <rect x="52" y="5" width="55" height="16" rx="3" fill="#00d2ff" stroke="none"/>
      <rect x="113" y="5" width="30" height="16" rx="3" fill="#00d2ff" stroke="none"/>
      <line x1="70" y1="-8" x2="70" y2="34" stroke-width="4"/>
    </g>

    <!-- Icon badge "Sm" (SharkMotion) -->
    <g transform="translate(60, 555)">
      <rect x="0" y="0" width="92" height="92" rx="20"/>
      <text x="46" y="63" font-family="'Cal Sans', Arial, sans-serif" font-weight="bold" font-size="42" fill="#00d2ff" stroke="none" text-anchor="middle">Sm</text>
    </g>

    <!-- Filmstrip - bottom-left -->
    <g transform="translate(85,800) rotate(4)">
      <rect x="0" y="0" width="130" height="44" rx="6"/>
      <rect x="9" y="7" width="12" height="10" rx="2" fill="#00d2ff" stroke="none"/>
      <rect x="29" y="7" width="12" height="10" rx="2" fill="#00d2ff" stroke="none"/>
      <rect x="49" y="7" width="12" height="10" rx="2" fill="#00d2ff" stroke="none"/>
      <rect x="69" y="7" width="12" height="10" rx="2" fill="#00d2ff" stroke="none"/>
      <rect x="89" y="7" width="12" height="10" rx="2" fill="#00d2ff" stroke="none"/>
      <rect x="9" y="27" width="12" height="10" rx="2" fill="#00d2ff" stroke="none"/>
      <rect x="29" y="27" width="12" height="10" rx="2" fill="#00d2ff" stroke="none"/>
      <rect x="49" y="27" width="12" height="10" rx="2" fill="#00d2ff" stroke="none"/>
      <rect x="69" y="27" width="12" height="10" rx="2" fill="#00d2ff" stroke="none"/>
      <rect x="89" y="27" width="12" height="10" rx="2" fill="#00d2ff" stroke="none"/>
    </g>

    <!-- Audio Waveform - bottom-right -->
    <g transform="translate(790,815)">
      <path d="M0 20 L0 20 M12 5 L12 35 M24 -12 L24 52 M36 -22 L36 62 M48 -8 L48 48 M60 10 L60 30 M72 -18 L72 58 M84 0 L84 40" stroke-width="7"/>
    </g>

    <!-- Graph curve with keyframes -->
    <g transform="translate(805, 555)">
      <line x1="0" y1="0" x2="0" y2="95"/>
      <line x1="0" y1="95" x2="100" y2="95"/>
      <polyline points="12,75 32,50 52,60 72,22 92,38" fill="none"/>
      <circle cx="12" cy="75" r="5" fill="#00d2ff" stroke="none"/>
      <circle cx="32" cy="50" r="5" fill="#00d2ff" stroke="none"/>
      <circle cx="52" cy="60" r="5" fill="#00d2ff" stroke="none"/>
      <circle cx="72" cy="22" r="5" fill="#00d2ff" stroke="none"/>
      <circle cx="92" cy="38" r="5" fill="#00d2ff" stroke="none"/>
    </g>
  </g>

  <!-- ===== Centerpiece: Aerodynamic Shark Motion Emblem ===== -->
  <g filter="url(#oceanGlow)" opacity="0.3">
    <!-- Shark Fin Silhouette Ambient Glow -->
    <path d="M510 180 C500 280 430 380 280 450 C380 455 520 480 620 540 C670 450 680 320 510 180 Z" fill="#00d2ff"/>
  </g>

  <!-- Main Shark Fin Dynamic Curves -->
  <g>
    <!-- Background Fin Shadow -->
    <path d="M500 170 C488 285 410 395 240 470 C360 475 510 500 620 565 C680 460 690 320 500 170 Z" fill="#0369a1" opacity="0.8"/>

    <!-- Primary Powerful Shark Fin (Apex Cut) -->
    <path d="M520 150 C508 275 425 390 250 465 C380 470 535 495 650 560 C705 450 715 305 520 150 Z" fill="url(#sharkCyan)"/>

    <!-- Motion Speed Cuts / Gills / Flow lines -->
    <!-- Blade Cut 1 -->
    <path d="M505 285 C470 340 405 400 320 440 C345 435 385 425 425 410 C465 375 495 330 505 285 Z" fill="#040a14" opacity="0.45"/>
    <path d="M545 350 C520 395 475 440 415 470 C440 465 475 455 510 440 C535 410 545 380 545 350 Z" fill="#040a14" opacity="0.45"/>

    <!-- Dynamic Ocean Speed Waves underneath -->
    <path d="M190 550 C320 520 450 535 560 590 C660 640 760 635 830 590 C780 655 670 685 550 655 C430 625 310 630 190 670 C210 625 210 585 190 550 Z" fill="url(#sharkFinShade)" opacity="0.9"/>
    
    <path d="M230 640 C350 610 470 625 580 675 C670 715 765 710 820 675 C775 730 675 755 565 730 C455 705 345 710 230 745 C250 705 250 670 230 640 Z" fill="#00d2ff" opacity="0.75"/>

    <!-- Apex Sharp Highlight Point -->
    <circle cx="520" cy="150" r="10" fill="#ffffff"/>
  </g>
</g>
</svg>
